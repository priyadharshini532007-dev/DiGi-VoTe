spring:
  application:
    name: digivote
  config:
    # Local development: read KEY=VALUE pairs from the git-ignored .env at the repository root.
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/digivote}
    username: ${DB_USERNAME:digivote}
    password: ${DB_PASSWORD:}
    hikari:
      # Spring-managed singleton connection pool (Singleton pattern)
      pool-name: digivote-pool
      maximum-pool-size: 15
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      # One origin: the HTML prototype in <repo>/web is served next to /api. The first location is the live
      # source folder (edit and refresh during development); the second is the copy packaged into the jar.
      static-locations: "file:${DIGIVOTE_WEB_DIR:../web}/,classpath:/static/"
      cache:
        cachecontrol:
          no-cache: true   # always revalidate (ETag) so edits show up; assets are small
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 13MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

digivote:
  dev-mode: ${DIGIVOTE_DEV_MODE:true}
  local-dir: ${DIGIVOTE_LOCAL_DIR:../.local}
  # Same origin as the API now (the prototype is served by this app); CORS only matters for the legacy React dev server.
  public-base-url: ${DIGIVOTE_PUBLIC_BASE_URL:http://localhost:${PORT:8080}}
  cors-origins: ${DIGIVOTE_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt-secret: ${DIGIVOTE_JWT_SECRET:}
    jwt-ttl-minutes: ${DIGIVOTE_JWT_TTL_MINUTES:120}
    master-key: ${DIGIVOTE_MASTER_KEY:}
    activation-ttl-hours: 168
  crypto:
    rsa-bits: ${DIGIVOTE_RSA_BITS:2048}
    paillier-bits: ${DIGIVOTE_PAILLIER_BITS:2048}
  qr-confirmation:
    # When true, a ballot cast on an election whose rules require QR receipts only counts after its signed QR receipt is
    # submitted within 30 seconds (see V12). Off by default: ballots are final when accepted.
    enabled: ${DIGIVOTE_QR_CONFIRMATION:false}
  signup:
    # Slug of the organization that self sign-up adds people to (as Voter or Candidate). Empty = sign-up disabled.
    organization-slug: ${DIGIVOTE_SIGNUP_ORG_SLUG:}
  anonymity:
    # Ballots reach the public bulletin board only in shuffled batches of at least this size, and the rest
    # when voting closes. Larger batches give each voter a larger anonymity set during voting.
    bulletin-batch-size: ${DIGIVOTE_BULLETIN_BATCH_SIZE:10}
  storage:
    provider: ${DIGIVOTE_STORAGE_PROVIDER:local}
    max-upload-bytes: 10485760
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:}
    app-check-enabled: ${FIREBASE_APP_CHECK_ENABLED:false}
    project-number: ${FIREBASE_PROJECT_NUMBER:}
